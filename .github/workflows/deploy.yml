name: Deploy to Hetzner

# Ausspielen der Seite auf das Webhosting des aed.
#
# Anders als bei Scharpf oder Krickl wird hier kein statisches Verzeichnis
# abgelegt: Die Seite braucht einen laufenden Node-Prozess samt Datenbank
# (Jurybereich, Einreichungen, Bildverzeichnis). Hochgeladen wird deshalb
# der fertige Build aus .output, danach startet die Anwendung neu.
#
# Nötige Secrets im Repository (Settings -> Secrets -> Actions):
#   HETZNER_HOST     Hostname des Pakets, z. B. www700.your-server.de
#   HETZNER_USER     SSH-Benutzer, z. B. esx3xy
#   HETZNER_SSH_KEY  privater Schlüssel (ed25519), passend zum in konsoleH
#                    hinterlegten öffentlichen Schlüssel
#   HETZNER_PFAD     Zielverzeichnis, z. B. /usr/www/users/esx3xy/aed
#
# Hetzner nutzt für SSH den Port 222, nicht 22.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bilder aus Lovable holen
        # In Lovable hochgeladene Bilder liegen auf deren CDN und nicht im
        # Repository. Ohne diesen Schritt bleiben sie auf unserem Server leer.
        run: npm run assets:holen

      - name: Für Node bauen
        run: npm run build:node

      - name: Build prüfen
        # Ohne NITRO_PRESET entstünde ein Cloudflare-Build, der auf Hetzner
        # nicht startet. Lieber hier abbrechen als eine tote Seite ausspielen.
        run: |
          grep -q '"preset": "node-server"' .output/nitro.json \
            || { echo "Falscher Build – kein node-server-Preset"; exit 1; }

      - name: SSH vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 222 -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Hochladen
        # --delete räumt alte Dateien weg. Die Dateiablage der Einreichungen
        # und die Umgebungswerte liegen außerhalb von .output und bleiben.
        run: |
          rsync -az --delete --stats \
            -e "ssh -p 222 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            .output/ \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:${{ secrets.HETZNER_PFAD }}/.output/"

      - name: Neustart-Skript mitschicken
        run: |
          scp -P 222 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            scripts/hetzner-neustart.sh \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:${{ secrets.HETZNER_PFAD }}/hetzner-neustart.sh"

      - name: Anwendung neu starten
        # Unverzichtbar: Der alte Prozess sucht sonst Dateien, die der Upload
        # gerade ersetzt hat, und die Seite antwortet nur noch mit Fehler 500.
        # Darum auch kein continue-on-error – lieber ein roter Lauf als eine
        # tote Seite, von der niemand etwas merkt.
        run: |
          ssh -p 222 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "sh ${{ secrets.HETZNER_PFAD }}/hetzner-neustart.sh"

      - name: Seite antwortet wieder
        # Die erste Anfrage startet die Anwendung und darf deshalb dauern.
        # HETZNER_PRUEF_URL ist optional; ohne sie entfällt die Prüfung.
        if: ${{ vars.HETZNER_PRUEF_URL != '' }}
        run: |
          for versuch in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                   "${{ vars.HETZNER_PRUEF_URL }}" || echo 000)
            echo "Versuch $versuch: $code"
            case "$code" in
              2*|3*) echo "Seite ist wieder da."; exit 0 ;;
            esac
            sleep 10
          done
          echo "Seite antwortet nach dem Neustart nicht." >&2
          exit 1
